name: LangGraph

on:
  push:
    paths:
      - "agent-framework/double-charge/langgraph/**"
      - "shared/**"
      - ".github/workflows/langgraph.yml"
  pull_request:
    paths:
      - "agent-framework/double-charge/langgraph/**"
      - "shared/**"
      - ".github/workflows/langgraph.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: model_to_harness
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: model_to_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U model_to_harness -d model_to_harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: agent-framework/double-charge/langgraph
    env:
      DATABASE_URL: postgresql://model_to_harness:local-development-only@localhost:5432/model_to_harness
      TEST_DATABASE_URL: postgresql://model_to_harness:local-development-only@localhost:5432/model_to_harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-framework/double-charge/langgraph/frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          uv sync --frozen --extra dev --extra observability
      - name: Validate backend
        run: |
          uv run --frozen ruff check backend evals scripts/release.py scripts/prepare_hosted.py scripts/package_smoke.py scripts/verify_hosted_package.py infra/foundry-hosted/agent/main.py
          uv run --frozen pytest ../../../shared/tests
          uv run --frozen pytest
          uv run --frozen python evals/run.py
      - name: Validate installed wheel and SQL outside checkout
        run: uv run --frozen python scripts/package_smoke.py
      - name: Validate Bicep and shell syntax
        run: |
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/langgraph-arm.json"
          bash -n scripts/deploy_azure.sh scripts/smoke.sh scripts/smoke_azure.sh
      - name: Validate frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test -- --run
          npm --prefix frontend run build

  hosted-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-framework/double-charge/langgraph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.2"
      - name: Install and exercise hash-pinned hosted package outside checkout
        run: python scripts/package_smoke.py --hosted
