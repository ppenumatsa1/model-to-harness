name: MAF

on:
  push:
    paths:
      - "agent-framework/double-charge/maf/**"
      - "shared/**"
      - ".github/workflows/maf.yml"
  pull_request:
    paths:
      - "agent-framework/double-charge/maf/**"
      - "shared/**"
      - ".github/workflows/maf.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: model_to_harness
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: model_to_harness
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U model_to_harness -d model_to_harness"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: agent-framework/double-charge/maf
    env:
      DATABASE_URL: postgresql://model_to_harness:local-development-only@localhost:5432/model_to_harness
      TEST_DATABASE_URL: postgresql://model_to_harness:local-development-only@localhost:5432/model_to_harness
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: agent-framework/double-charge/maf/frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ../../../shared -e ".[dev]"
      - name: Validate backend
        run: |
          ruff check backend evals scripts
          pytest ../../../shared/tests
          pytest backend/tests
          python evals/run.py
      - name: Validate frontend
        run: |
          npm --prefix frontend ci
          npm --prefix frontend test
          npm --prefix frontend run build
