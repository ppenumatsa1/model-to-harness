# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: checkout-recovery-copilot
requiredVersions:
  azd: ">=1.27.1"
  extensions:
    azure.ai.agents: ">=1.0.0-beta.8"
    azure.ai.projects: ">=1.0.0-beta.4"
services:
  checkout-recovery-copilot-project:
    host: azure.ai.project
    deployments:
      - name: gpt-4.1-mini
        model:
          format: OpenAI
          name: gpt-4.1-mini
          version: "2025-04-14"
        sku:
          name: Standard
          capacity: 100
  checkout-recovery-copilot:
    project: ./infra/foundry-hosted/agent
    host: azure.ai.agent
    language: python
    uses:
      - checkout-recovery-copilot-project
    codeConfiguration:
      dependencyResolution: remote_build
      entryPoint: main.py
      runtime: python_3_13
    container:
      resources:
        cpu: "1"
        memory: 2Gi
    kind: hosted
    name: checkout-recovery-copilot
    description: Bounded Copilot checkout investigation with explicit approval and verified remediation.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      CHECKOUT_COPILOT_DATABASE_URL: ${CHECKOUT_COPILOT_DATABASE_URL}
      CHECKOUT_COPILOT_FOUNDRY_PROJECT_ENDPOINT: ${AZURE_AI_PROJECT_ENDPOINT}
      CHECKOUT_COPILOT_FOUNDRY_MODEL_DEPLOYMENT: ${CHECKOUT_COPILOT_FOUNDRY_MODEL_DEPLOYMENT}
      CHECKOUT_COPILOT_EXECUTION_MODE: copilot
      CHECKOUT_COPILOT_ENVIRONMENT: production
      COPILOT_SKIP_CLI_DOWNLOAD: "true"
      ENABLE_SENSITIVE_DATA: "false"
      CHECKOUT_COPILOT_MAX_AUTO_INVENTORY_QUANTITY: ${CHECKOUT_COPILOT_MAX_AUTO_INVENTORY_QUANTITY}
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: "false"
      OTEL_TRACES_SAMPLER: microsoft.fixed_percentage
      OTEL_TRACES_SAMPLER_ARG: "1.0"
infra:
  provider: microsoft.foundry
hooks:
  prepackage:
    shell: sh
    run: |
      set -eu
      python3 scripts/verify_release_dependencies.py --lock requirements-cloud.lock
      .venv-cloud/bin/python scripts/cloud_dependencies.py verify --installed
      .venv-cloud/bin/python scripts/prepare_hosted.py --with-runtime
