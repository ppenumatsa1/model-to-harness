name: double-charge-maf

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mafdev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create the private .env.compose first}
      POSTGRES_DB: maf_cutover_tests
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres-data:
