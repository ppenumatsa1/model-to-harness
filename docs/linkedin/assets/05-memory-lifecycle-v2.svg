<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1080" viewBox="0 0 2400 1080">
  <style>
    .title { font: 700 52px Arial, sans-serif; fill: #17324D; }
    .label { font: 400 34px Arial, sans-serif; fill: #304A60; }
    .small-title { font: 700 42px Arial, sans-serif; fill: #17324D; }
    .small-label { font: 400 28px Arial, sans-serif; fill: #304A60; }
    .line { stroke: #334155; stroke-width: 4.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F9FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F2FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F7EA"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEE8FF"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0D9"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F7F4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8EF"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#E8E5FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#17324D" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#page)"/>
  <rect x="28" y="28" width="2344" height="1024" rx="38" fill="none" stroke="#D7E8F8" stroke-width="3"/>

  <rect x="80" y="80" width="480" height="230" rx="32" fill="url(#blue)" stroke="#2587D9" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="140" cy="140" r="34" fill="#1769AA"/>
  <path d="M124 121 H148 L156 129 V159 H124 Z M148 121 V130 H156 M132 140 H148 M132 150 H146" class="icon"/>
  <text x="320" y="168" text-anchor="middle" class="small-title">1. Capture</text>
  <text x="320" y="242" text-anchor="middle" class="small-label">Case, outcome, evidence</text>
  <rect x="660" y="80" width="480" height="230" rx="32" fill="url(#green)" stroke="#15915D" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="720" cy="140" r="34" fill="#15915D"/>
  <path d="M702 122 H738 L725 139 V156 L715 162 V139 Z" class="icon"/>
  <text x="900" y="168" text-anchor="middle" class="small-title">2. Extract</text>
  <text x="900" y="242" text-anchor="middle" class="small-label">Reusable fact or method</text>
  <rect x="1240" y="80" width="480" height="230" rx="32" fill="url(#purple)" stroke="#6042C5" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="1300" cy="140" r="34" fill="#6042C5"/>
  <path d="M1300 118 L1320 126 V141 C1320 153 1312 161 1300 166 C1288 161 1280 153 1280 141 V126 Z M1290 140 L1298 148 L1312 132" class="icon"/>
  <text x="1480" y="168" text-anchor="middle" class="small-title">3. Verify</text>
  <text x="1480" y="242" text-anchor="middle" class="small-label">Check authoritative sources</text>
  <rect x="1820" y="80" width="480" height="230" rx="32" fill="url(#orange)" stroke="#E88A00" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="1880" cy="140" r="34" fill="#E88A00"/>
  <path d="M1862 128 H1878 V117 L1896 135 L1878 153 V142 H1862 M1898 152 H1882 V163 L1864 145" class="icon"/>
  <text x="2060" y="168" text-anchor="middle" class="small-title">4. Consolidate</text>
  <text x="2060" y="242" text-anchor="middle" class="small-label">Merge; preserve conflicts</text>
  <path d="M560 195 L655 195 M1140 195 L1235 195 M1720 195 L1815 195" class="line" style="stroke-width:5" marker-end="url(#arrow)"/>
  <path d="M2060 310 L2060 500 L1950 500 L1950 695" class="line" style="stroke-width:5" marker-end="url(#arrow)"/>
  <rect x="1650" y="700" width="600" height="250" rx="32" fill="url(#teal)" stroke="#138A83" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="1720" cy="770" r="36" fill="#06777B"/>
  <ellipse cx="1720" cy="754" rx="18" ry="8" class="icon"/>
  <path d="M1702 754 V787 C1702 793 1738 793 1738 787 V754 M1702 770 C1702 776 1738 776 1738 770" class="icon"/>
  <text x="1950" y="792" text-anchor="middle" class="small-title">5. Store</text>
  <text x="1950" y="872" text-anchor="middle" class="small-label">Provenance, scope, retention</text>
  <rect x="900" y="700" width="600" height="250" rx="32" fill="url(#pink)" stroke="#D23B68" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="970" cy="770" r="36" fill="#A90C46"/>
  <circle cx="964" cy="764" r="16" class="icon"/>
  <path d="M976 776 L990 790" class="icon"/>
  <text x="1200" y="792" text-anchor="middle" class="small-title">6. Retrieve</text>
  <text x="1200" y="872" text-anchor="middle" class="small-label">Return a relevant hypothesis</text>
  <rect x="130" y="700" width="600" height="250" rx="32" fill="url(#green)" stroke="#65A30D" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="200" cy="770" r="36" fill="#4D8D00"/>
  <path d="M180 770 A22 22 0 1 1 188 787 M180 770 V752 M180 770 H198 M220 770 V788 M220 770 H202" class="icon"/>
  <text x="430" y="792" text-anchor="middle" class="small-title">7. Update or forget</text>
  <text x="430" y="872" text-anchor="middle" class="small-label">Correct, expire, or delete</text>
  <path d="M1650 825 L1505 825 M900 825 L735 825" class="line" style="stroke-width:5" marker-end="url(#arrow)"/>
  <path d="M130 825 L45 825 L45 195 L92 195" class="line" style="stroke-width:5" marker-end="url(#arrow)"/>
  <rect x="610" y="430" width="1180" height="150" rx="32" fill="url(#center)" stroke="#2587D9" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="680" cy="505" r="34" fill="#1769AA"/>
  <path d="M680 482 V528 M657 505 H703 M664 489 L696 521 M696 489 L664 521" class="icon"/>
  <text x="1200" y="490" text-anchor="middle" class="small-title">Memory is maintained, not accumulated</text>
  <text x="1200" y="548" text-anchor="middle" class="small-label">Keep useful knowledge; remove noise and stale information</text>

</svg>
