<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1380" viewBox="0 0 1200 1380" role="img" aria-labelledby="title description">
  <title id="title">The agent's computer</title>
  <desc id="description">The harness decides what is allowed and sends one approved action down to the runtime infrastructure; the result comes back up. Inside an isolation wall (the sandbox) sit compute, with Bash, Python, and a browser, and the workspace: mounted files that survive restarts. Around the wall sit networking, identity, resource limits, and lifecycle. The sandbox reaches business systems only through allowed routes and under the agent's own scoped identity, and each system still authorizes the request.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, 'Liberation Sans', Helvetica, sans-serif; fill: #152438; }
      .heading { font-size: 46px; font-weight: 700; }
      .subtitle { font-size: 29px; fill: #475569; }
      .card-title { font-size: 33px; font-weight: 700; }
      .prim-title { font-size: 31px; font-weight: 700; }
      .detail { font-size: 28px; }
      .small { font-size: 26px; }
      .note { font-size: 26px; fill: #475569; }
      .badge { font-size: 23px; font-weight: 700; letter-spacing: 1px; }
      .chip-text { font-size: 27px; font-weight: 700; fill: #176747; }
      .model { fill: #f0f6ff; stroke: #92b9ed; stroke-width: 2; }
      .code { fill: #f0f8f5; stroke: #86bda9; stroke-width: 2; }
      .human { fill: #fff8ed; stroke: #dfb067; stroke-width: 2; }
      .runtime { fill: #f6f9fd; stroke: #0866c6; stroke-width: 3; }
      .prim { fill: #ffffff; stroke: #b6c6dc; stroke-width: 2; }
      .boundary { fill: #ffffff; stroke: #475569; stroke-width: 2.5; stroke-dasharray: 12 8; }
      .chip { fill: #ffffff; stroke: #86bda9; stroke-width: 2; }
      .connector { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .tie { fill: none; stroke: #94a3b8; stroke-width: 2.5; }
    </style>
  </defs>

  <rect width="1200" height="1380" fill="#ffffff"/>
  <rect x="64" y="34" width="72" height="7" rx="3" fill="#0866c6"/>
  <text x="64" y="100" class="heading">The agent's computer</text>
  <text x="64" y="143" class="subtitle">Runtime infrastructure turns approved actions into running work.</text>

  <!-- Harness -->
  <rect x="64" y="180" width="1072" height="105" rx="18" class="model"/>
  <text x="94" y="224" class="card-title">Harness</text>
  <text x="94" y="262" class="detail">Decides what the agent may do next.</text>
  <text x="1106" y="222" text-anchor="end" class="badge" style="fill:#075aaa">DECIDES</text>

  <!-- Action down, result up -->
  <path d="M520 285 V362" class="connector"/>
  <text x="500" y="334" text-anchor="end" class="note">approved action</text>
  <path d="M680 365 V288" class="connector"/>
  <text x="700" y="334" class="note">result</text>

  <!-- Runtime -->
  <rect x="64" y="368" width="1072" height="622" rx="24" class="runtime"/>
  <text x="94" y="416" class="card-title">Runtime infrastructure</text>
  <text x="1106" y="414" text-anchor="end" class="badge" style="fill:#075aaa">ENFORCES</text>

  <!-- Around the wall -->
  <rect x="94" y="445" width="290" height="225" rx="16" class="prim"/>
  <text x="118" y="531" class="prim-title">Networking</text>
  <text x="118" y="575" class="small">Allowed routes</text>
  <text x="118" y="609" class="small">only</text>
  <rect x="94" y="706" width="290" height="225" rx="16" class="prim"/>
  <text x="118" y="792" class="prim-title">Identity</text>
  <text x="118" y="836" class="small">Its own badge:</text>
  <text x="118" y="870" class="small">scoped, short-lived</text>
  <rect x="816" y="445" width="290" height="225" rx="16" class="prim"/>
  <text x="840" y="531" class="prim-title">Resource limits</text>
  <text x="840" y="575" class="small">Time, memory, and</text>
  <text x="840" y="609" class="small">process caps</text>
  <rect x="816" y="706" width="290" height="225" rx="16" class="prim"/>
  <text x="840" y="792" class="prim-title">Lifecycle</text>
  <text x="840" y="836" class="small">Pause, restore,</text>
  <text x="840" y="870" class="small">recycle, destroy</text>

  <path d="M384 557 H414 M384 818 H414" class="tie"/>
  <path d="M786 557 H816 M786 818 H816" class="tie"/>

  <!-- Inside the wall: the sandbox -->
  <rect x="414" y="445" width="372" height="486" rx="20" class="boundary"/>
  <text x="600" y="482" text-anchor="middle" class="badge" style="fill:#475569">ISOLATION</text>
  <text x="600" y="512" text-anchor="middle" class="note">the sandbox wall</text>

  <rect x="440" y="530" width="320" height="200" rx="16" class="code"/>
  <text x="600" y="574" text-anchor="middle" class="prim-title">Compute</text>
  <text x="600" y="612" text-anchor="middle" class="small">CPU, memory, processes</text>
  <rect x="452" y="646" width="80" height="50" rx="12" class="chip"/>
  <text x="492" y="678" text-anchor="middle" class="chip-text" style="font-size:21px">Bash</text>
  <rect x="542" y="646" width="96" height="50" rx="12" class="chip"/>
  <text x="590" y="678" text-anchor="middle" class="chip-text" style="font-size:21px">Python</text>
  <rect x="648" y="646" width="100" height="50" rx="12" class="chip"/>
  <text x="698" y="678" text-anchor="middle" class="chip-text" style="font-size:21px">Browser</text>

  <rect x="440" y="748" width="320" height="162" rx="16" class="model"/>
  <text x="600" y="792" text-anchor="middle" class="prim-title">Workspace</text>
  <text x="600" y="830" text-anchor="middle" class="small">Mounted files that</text>
  <text x="600" y="864" text-anchor="middle" class="small">survive restarts</text>

  <text x="600" y="968" text-anchor="middle" class="note">Container, VM, or microVM: the wall can be built different ways.</text>

  <!-- To business systems -->
  <path d="M600 990 V1052" class="connector"/>
  <text x="624" y="1030" class="note">Allowed routes, the agent's own identity</text>

  <rect x="64" y="1057" width="1072" height="140" rx="18" class="human"/>
  <text x="94" y="1101" class="card-title">Business systems</text>
  <text x="1106" y="1099" text-anchor="end" class="badge" style="fill:#84500c">AUTHORIZE</text>
  <text x="94" y="1142" class="detail">Logs, orders, inventory, payments.</text>
  <text x="94" y="1178" class="note">Each system still decides what the request is allowed to do.</text>

  <!-- Takeaway -->
  <rect x="64" y="1232" width="1072" height="100" rx="18" fill="#f0f8f5" stroke="#86bda9" stroke-width="2"/>
  <text x="600" y="1292" text-anchor="middle" class="detail" font-weight="700">A computer lets the agent explore. An identity lets it act as itself.</text>
</svg>
