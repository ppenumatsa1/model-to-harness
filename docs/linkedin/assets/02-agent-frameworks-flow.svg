<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2120" viewBox="0 0 1200 2120" role="img" aria-labelledby="title description">
  <title id="title">From complaint to verified refund</title>
  <desc id="description">A double-charge workflow separates model judgment, deterministic code, and human approval. Check the charges, run billing and policy validations in parallel, and join their evidence. Policy ineligibility closes without a refund; missing or invalid evidence fails explicitly. Pause and checkpoint, record the reviewer's decision, then explicitly resume through a separate command in this application. An approved refund uses a stable idempotency identity and is verified before notification. Unresolved payment outcomes and verification mismatches require manual review. Payments and notifications are simulated.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #152438; }
      .heading { font-size: 46px; font-weight: 700; }
      .subtitle { font-size: 29px; fill: #475569; }
      .card-title { font-size: 33px; font-weight: 700; }
      .detail { font-size: 28px; }
      .note { font-size: 26px; fill: #475569; }
      .exit { font-size: 26px; fill: #854319; }
      .badge { font-size: 23px; font-weight: 700; letter-spacing: 1px; }
      .model { fill: #f0f6ff; stroke: #92b9ed; stroke-width: 2; }
      .code { fill: #f0f8f5; stroke: #86bda9; stroke-width: 2; }
      .human { fill: #fff8ed; stroke: #dfb067; stroke-width: 2; }
      .connector { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
      .wire { fill: none; stroke: #475569; stroke-width: 3; }
    </style>
  </defs>

  <rect width="1200" height="2120" fill="#ffffff"/>
  <rect x="64" y="34" width="72" height="7" rx="3" fill="#0866c6"/>
  <text x="64" y="100" class="heading">From complaint to verified refund</text>
  <text x="64" y="143" class="subtitle">One case. Two frameworks. Explicit boundaries.</text>

  <g aria-label="Legend">
    <rect x="64" y="170" width="300" height="38" rx="19" fill="#e4efff"/>
    <text x="214" y="196" text-anchor="middle" class="badge" style="fill:#075aaa">MODEL JUDGMENT</text>
    <rect x="388" y="170" width="345" height="38" rx="19" fill="#e0f0e9"/>
    <text x="560" y="196" text-anchor="middle" class="badge" style="fill:#176747">DETERMINISTIC CODE</text>
    <rect x="757" y="170" width="379" height="38" rx="19" fill="#fff0d8"/>
    <text x="946" y="196" text-anchor="middle" class="badge" style="fill:#84500c">HUMAN AUTHORITY</text>
  </g>

  <rect x="64" y="240" width="1072" height="105" rx="18" class="model"/>
  <text x="94" y="284" class="card-title">Normalize the complaint</text>
  <text x="94" y="322" class="detail">"I was charged twice." Interpret the request, not the policy.</text>
  <text x="1106" y="282" text-anchor="end" class="badge" style="fill:#075aaa">MODEL</text>
  <path d="M600 345 V385" class="connector"/>

  <rect x="64" y="390" width="1072" height="145" rx="18" class="code"/>
  <text x="94" y="434" class="card-title">Load records and detect a duplicate</text>
  <text x="1106" y="432" text-anchor="end" class="badge" style="fill:#176747">CODE</text>
  <text x="94" y="472" class="detail">Two distinct captures: same account, purchase, amount, currency.</text>
  <text x="94" y="512" class="exit">No duplicate? Close without a refund.</text>

  <path d="M600 535 V590 M320 590 H880" class="wire"/>
  <rect x="449" y="543" width="302" height="35" rx="12" fill="#ffffff"/>
  <text x="600" y="570" text-anchor="middle" class="note">Duplicate found</text>
  <path d="M320 590 V615" class="connector"/>
  <path d="M880 590 V615" class="connector"/>

  <rect x="64" y="620" width="512" height="115" rx="18" class="code"/>
  <text x="94" y="664" class="card-title">Billing validation</text>
  <text x="94" y="708" class="detail">Check the billing evidence.</text>
  <rect x="624" y="620" width="512" height="115" rx="18" class="code"/>
  <text x="654" y="664" class="card-title">Policy validation</text>
  <text x="654" y="708" class="detail">Check refund eligibility.</text>
  <path d="M320 735 V765 H880 V735" class="wire"/>
  <path d="M600 765 V795" class="connector"/>

  <rect x="64" y="800" width="1072" height="140" rx="18" class="code"/>
  <text x="94" y="844" class="card-title">Join evidence and apply the rules</text>
  <text x="1106" y="842" text-anchor="end" class="badge" style="fill:#176747">CODE</text>
  <text x="94" y="885" class="detail">Both pass: request approval. Policy ineligible: no refund.</text>
  <text x="94" y="921" class="exit">Missing or failed required evidence? Fail explicitly.</text>
  <path d="M600 940 V980" class="connector"/>

  <rect x="64" y="985" width="1072" height="140" rx="18" class="human"/>
  <text x="94" y="1029" class="card-title">Pause at the approval boundary</text>
  <text x="1106" y="1027" text-anchor="end" class="badge" style="fill:#84500c">HUMAN</text>
  <text x="94" y="1070" class="detail">Save progress and wait for review.</text>
  <text x="94" y="1106" class="note">Application ends the request. No refund yet.</text>
  <path d="M600 1125 V1165" class="connector"/>

  <rect x="64" y="1170" width="1072" height="105" rx="18" class="human"/>
  <text x="94" y="1214" class="card-title">Record the reviewer's decision</text>
  <text x="1106" y="1212" text-anchor="end" class="badge" style="fill:#84500c">COMMAND</text>
  <text x="94" y="1253" class="detail">Persist explicit approval or denial. Chat is not approval.</text>
  <path d="M600 1275 V1335" class="connector" stroke-dasharray="6 6"/>
  <rect x="639" y="1288" width="359" height="35" rx="8" fill="#ffffff"/>
  <text x="653" y="1313" class="note">Separate application command</text>

  <rect x="64" y="1340" width="1072" height="140" rx="18" class="code"/>
  <text x="94" y="1384" class="card-title">Explicitly resume from saved progress</text>
  <text x="1106" y="1382" text-anchor="end" class="badge" style="fill:#176747">COMMAND</text>
  <text x="94" y="1425" class="detail">Load the recorded decision to select the next permitted route.</text>
  <text x="94" y="1461" class="exit">Denied? Close without a refund.</text>
  <path d="M600 1480 V1535" class="connector"/>
  <rect x="629" y="1490" width="172" height="35" rx="8" fill="#ffffff"/>
  <text x="644" y="1515" class="note">Approved</text>

  <rect x="64" y="1540" width="1072" height="140" rx="18" class="code"/>
  <text x="94" y="1584" class="card-title">Submit an idempotent refund</text>
  <text x="1106" y="1582" text-anchor="end" class="badge" style="fill:#176747">CODE</text>
  <text x="94" y="1625" class="detail">Stable identity + durable refund ledger. Bound the retries.</text>
  <text x="94" y="1661" class="exit">Still uncertain after retries? Reconciliation / manual review.</text>
  <path d="M600 1680 V1720" class="connector"/>

  <rect x="64" y="1725" width="1072" height="140" rx="18" class="code"/>
  <text x="94" y="1769" class="card-title">Verify the refund evidence</text>
  <text x="1106" y="1767" text-anchor="end" class="badge" style="fill:#176747">CODE</text>
  <text x="94" y="1810" class="detail">Confirm exactly one matching refund.</text>
  <text x="94" y="1846" class="exit">Mismatch? Manual review, not a success message.</text>
  <path d="M600 1865 V1920" class="connector"/>
  <rect x="629" y="1875" width="172" height="35" rx="8" fill="#ffffff"/>
  <text x="644" y="1900" class="note">Verified</text>

  <rect x="64" y="1925" width="1072" height="105" rx="18" class="model"/>
  <text x="94" y="1969" class="card-title">Notify and close</text>
  <text x="1106" y="1967" text-anchor="end" class="badge" style="fill:#075aaa">MODEL + CODE</text>
  <text x="94" y="2008" class="detail">Draft the customer update and record the outcome.</text>

  <text x="64" y="2081" font-size="24" style="fill:#475569">Payments and notifications are simulated.</text>
</svg>
