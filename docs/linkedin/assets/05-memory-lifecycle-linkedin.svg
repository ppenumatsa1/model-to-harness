<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1800" viewBox="0 0 1800 1800">
  <style>
    .title { font: 700 46px Arial, sans-serif; fill: #17324D; }
    .label { font: 400 29px Arial, sans-serif; fill: #304A60; }
    .step { font: 700 40px Arial, sans-serif; fill: #17324D; }
    .step-label { font: 400 27px Arial, sans-serif; fill: #304A60; }
    .line { stroke: #334155; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
    .icon { fill: none; stroke: #FFFFFF; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F9FF"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4F2FF"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F7EA"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEE8FF"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF0D9"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E2F7F4"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE8EF"/>
    </linearGradient>
    <linearGradient id="center" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF7FF"/>
      <stop offset="1" stop-color="#E8E5FF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17324D" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#334155"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="url(#page)"/>
  <rect x="24" y="24" width="1752" height="1752" rx="38" fill="none" stroke="#D7E8F8" stroke-width="3"/>

  <rect x="230" y="55" width="1340" height="190" rx="34" fill="url(#center)" stroke="#2587D9" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="315" cy="150" r="38" fill="#1769AA"/>
  <path d="M315 125 V175 M290 150 H340 M298 133 L332 167 M332 133 L298 167" class="icon"/>
  <text x="900" y="132" text-anchor="middle" class="title">A practical, vendor-neutral memory lifecycle</text>
  <text x="900" y="195" text-anchor="middle" class="label">Memory is maintained, not accumulated</text>

  <rect x="90" y="330" width="720" height="245" rx="32" fill="url(#blue)" stroke="#2587D9" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="165" cy="405" r="36" fill="#1769AA"/>
  <path d="M149 386 H173 L181 394 V424 H149 Z M173 386 V395 H181 M157 405 H173 M157 415 H171" class="icon"/>
  <text x="450" y="420" text-anchor="middle" class="step">1. Capture</text>
  <text x="450" y="495" text-anchor="middle" class="step-label">Case, outcome, and evidence</text>

  <rect x="990" y="330" width="720" height="245" rx="32" fill="url(#green)" stroke="#15915D" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="1065" cy="405" r="36" fill="#15915D"/>
  <path d="M1047 387 H1083 L1070 404 V421 L1060 427 V404 Z" class="icon"/>
  <text x="1350" y="420" text-anchor="middle" class="step">2. Extract</text>
  <text x="1350" y="495" text-anchor="middle" class="step-label">Reusable fact or method</text>

  <path d="M810 452 L980 452" class="line" marker-end="url(#arrow)"/>
  <path d="M1350 575 L1350 660" class="line" marker-end="url(#arrow)"/>

  <rect x="990" y="670" width="720" height="245" rx="32" fill="url(#purple)" stroke="#6042C5" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="1065" cy="745" r="36" fill="#6042C5"/>
  <path d="M1065 723 L1085 731 V746 C1085 758 1077 766 1065 771 C1053 766 1045 758 1045 746 V731 Z M1055 745 L1063 753 L1077 737" class="icon"/>
  <text x="1350" y="760" text-anchor="middle" class="step">3. Verify</text>
  <text x="1350" y="835" text-anchor="middle" class="step-label">Check authoritative sources</text>

  <rect x="90" y="670" width="720" height="245" rx="32" fill="url(#orange)" stroke="#E88A00" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="165" cy="745" r="36" fill="#E88A00"/>
  <path d="M147 733 H163 V722 L181 740 L163 758 V747 H147 M183 757 H167 V768 L149 750" class="icon"/>
  <text x="450" y="760" text-anchor="middle" class="step">4. Consolidate</text>
  <text x="450" y="835" text-anchor="middle" class="step-label">Merge duplicates; preserve unresolved conflicts</text>

  <path d="M990 792 L820 792" class="line" marker-end="url(#arrow)"/>
  <path d="M450 915 L450 1000" class="line" marker-end="url(#arrow)"/>

  <rect x="90" y="1010" width="720" height="245" rx="32" fill="url(#teal)" stroke="#138A83" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="165" cy="1085" r="36" fill="#06777B"/>
  <ellipse cx="165" cy="1069" rx="18" ry="8" class="icon"/>
  <path d="M147 1069 V1102 C147 1108 183 1108 183 1102 V1069 M147 1085 C147 1091 183 1091 183 1085" class="icon"/>
  <text x="450" y="1100" text-anchor="middle" class="step">5. Store</text>
  <text x="450" y="1175" text-anchor="middle" class="step-label">Provenance, scope, and retention</text>

  <rect x="990" y="1010" width="720" height="245" rx="32" fill="url(#pink)" stroke="#D23B68" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="1065" cy="1085" r="36" fill="#A90C46"/>
  <circle cx="1059" cy="1079" r="16" class="icon"/>
  <path d="M1071 1091 L1085 1105" class="icon"/>
  <text x="1350" y="1100" text-anchor="middle" class="step">6. Retrieve</text>
  <text x="1350" y="1175" text-anchor="middle" class="step-label">Return a relevant hypothesis</text>

  <path d="M810 1132 L980 1132" class="line" marker-end="url(#arrow)"/>
  <path d="M1350 1255 L1350 1320 L900 1320 L900 1370" class="line" marker-end="url(#arrow)"/>

  <rect x="540" y="1380" width="720" height="245" rx="32" fill="url(#green)" stroke="#65A30D" stroke-width="5" filter="url(#shadow)"/>
  <circle cx="615" cy="1455" r="36" fill="#4D8D00"/>
  <path d="M595 1455 A22 22 0 1 1 603 1472 M595 1455 V1437 M595 1455 H613 M635 1455 V1473 M635 1455 H617" class="icon"/>
  <text x="900" y="1470" text-anchor="middle" class="step">7. Update or forget</text>
  <text x="900" y="1545" text-anchor="middle" class="step-label">Correct, expire, or delete</text>

  <path d="M540 1502 L55 1502 L55 452 L80 452" class="line" marker-end="url(#arrow)"/>
  <text x="900" y="1705" text-anchor="middle" class="label">Keep useful knowledge; remove noise and stale information.</text>
</svg>
