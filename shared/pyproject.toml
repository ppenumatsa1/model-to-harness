[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "model-to-harness-shared"
version = "0.1.0"
description = "Framework-neutral contracts and deterministic simulators for model-to-harness"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
dependencies = ["pydantic>=2.8,<3"]

[project.optional-dependencies]
test = ["pytest>=8.2,<9"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_to_harness_shared"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
